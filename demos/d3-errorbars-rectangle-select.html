
<!DOCTYPE html>
<meta charset="utf-8">
<html>
<head>
<style>

html, body {
  position: relative;
  height: 100%;
    font-family: Arial, Helvetica, sans-serif !important;
}

#plot1 {
    width: 100%;
    height: 75%;;
}

svg,
canvas {
  position: absolute;
  image-rendering: optimizeSpeed;
  image-rendering: crisp-edges;
  image-rendering: -moz-crisp-edges;
  image-rendering: -webkit-optimize-contrast;
  image-rendering: optimize-contrast;
  -ms-interpolation-mode: nearest-neighbor;
}

.axis-label {
  font-size: 18px;
}

.axis .tick text {
  font-size: 14px;
}

.axis path,
.axis line {
  fill: none;
  stroke: #000;
  shape-rendering: crispEdges;
}


.grid path {
      stroke-width: 1;
      fill: none;
}
.grid .tick {
    stroke: lightgrey;
    opacity: 0.7;
    stroke-width: 1;
    shape-rendering: crispEdges;
    user-select: none; 
    -webkit-user-select: none; 
    -moz-user-select: none;
}
 
.axis path {
    fill: none;
    stroke: #bbb;
    shape-rendering: crispEdges;
}
 
.axis text {
    fill: #555;
}
 
.axis line {	
    stroke: #e7e7e7;
    shape-rendering: crispEdges;
}
 
.axis .axis-label {
    user-select: none; 
    -webkit-user-select: none; 
    -moz-user-select: none;
}

.legend, .tick {
    user-select: none; 
    -webkit-user-select: none; 
    -moz-user-select: none;
}
 
.line {
    fill: none;
    stroke-width: 1.5px;
}

.highlight {
    stroke-width: 4.5px;
}
 
.dot {
    /* consider the stroke-with the mouse detect radius? */
    stroke: transparent;
    stroke-width: 10px;  
    cursor: pointer;
}
 
.dot:hover {
    stroke: rgba(68, 127, 255, 0.3);
}

rect {
  fill: none;
  user-select: none; 
  -webkit-user-select: none; 
  -moz-user-select: none;
}

rect.zoom {
  stroke: steelblue;
  fill-opacity: 0.5;
}
</style>
  <script type="importmap">
  {
    "imports": {
      "d3": "https://cdn.jsdelivr.net/npm/d3@7/+esm"
    }
  }
  </script>
</head>
<body>

<div id="plot1">
</div>
<div id="demos">
</div>
<script type="module">
  import { select } from "d3";
  import xyChart from "../src/xy-chart.js";
  import rectangleInteractor from "../src/rectangle-interactor.js";
  import rectangleSelect from "../src/rectangle-select.js";

  const chart = xyChart({show_line: true, show_errorbars: true, ytransform: 'log'});
  const opts1 = {
    type:'Rectangle',
    name:'roi_rectangle',
    color1: '#ff0000',
    color2: '#ff0000',
    fill: "none",
    showcenter: true,
    show: false,
    xmin: 0.022,
    ymin: 1.0,
    xmax: 0.024,
    ymax: 6
  }

  const response = await fetch("sample_data/pbr_live_data.json");
  const data = await response.json();

  const mydata = data;
  const c = select("#plot1")
    .data([data[0].data])
    .call(chart);
  const rectangle = new rectangleInteractor(opts1);
  const selector = new rectangleSelect();
  selector.callbacks(function() {console.log(arguments)});
  chart
    .options(data[0].options)
    .interactors(rectangle)
    .interactors(selector)
    //.zoomRect(true)

  // chart.target_ratio(1).update(); // changes aspect ratio!
  // var new_dims = chart.dims();
  // new_dims.xmax = 256;
  // chart.dims(new_dims).update(); // new dimensions for 2d plot object
  // chart.show_grid(false); // grid off

</script>
</body>
</html>
