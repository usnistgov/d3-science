<!DOCTYPE html>
<meta charset="utf-8">
<html>
<head>
<style>
html, body {
  height: 100%;
  overflow: hidden;
}
svg {
  width: 100%;
  height: 100%;
  float: left;
  border-bottom: solid 1px #ccc;
  border-right: solid 1px #ccc;
  margin-right: -1px;
  margin-bottom: -1px;
}

#editor_div { 
  width: 100%;
  height: 100%;
}
.highlight {
  fill-opacity: 0.6 !important;
}
.popup {
    position: absolute;
    background-color: #fff;
    /*width: 200px;*/
    border: 1px #ccc solid;
    border-radius: 6px;
    box-shadow: #333 2px 2px 4px;
    font-family: arial, helvetica, sans-serif;
    margin: 5px 5px 2px 2px;
}
.popup ul {
    padding: 5px;
    list-style-type: none;
    margin: 0;
}

.popup ul li {
    margin-top: 2px;
    margin-bottom: 2px;
    margin-right: 0px;
    margin-left: 0px;
    cursor: pointer;
}
.popup ul li:hover {
    background-color: LightGray;
}

.popup hr {
    margin: 0;
}

.input.label, .output.label {
    display: none;
}
</style>
<script type="importmap">
{
  "imports": {
    "d3": "https://cdn.jsdelivr.net/npm/d3@7/+esm"
  }
}
</script>
</head>
<body>
<script type="module">
import { select } from "d3";
import dataflowEditor from "../src/dataflow-editor-streamline-new.js";

const x0 = 150,
    y0 = 100, 
    dx = 135,
    dy = 40;

var module_opts = [
  {
    title: "load spec",
    inputs: [],
    outputs: ["out"],
    x: x0,
    y: y0
  },
  {
    title: "load bg",
    inputs: [],
    outputs: ["out"],
    x: x0,
    y: y0 + dy
  },
  {
    title: "load slit",
    inputs: [],
    outputs: ["out"],
    x: x0,
    y: y0 + 2*dy
  },
  {
    title: "mask",
    inputs: ["in"],
    outputs: ["out"],
    x: x0 + dx,
    y: y0
  },
  {
    title: "mask",
    inputs: ["in"],
    outputs: ["out"],
    x: x0 + dx,
    y: y0 + dy
  },
  {
    title: "mask",
    inputs: ["in"],
    outputs: ["out"],
    x: x0 + dx,
    y: y0 + 2*dy
  },
  {
    title: "join",
    inputs: ["in"],
    outputs: ["out"],
    x: x0 + 2*dx,
    y: y0
  },
  {
    title: "join",
    inputs: ["in"],
    outputs: ["out"],
    x: x0 + 2*dx,
    y: y0 + dy
  },
  {
    title: "attenuate",
    inputs: ["in"],
    outputs: ["out"],
    x: x0 + 2*dx,
    y: y0 + 2*dy
  },
  {
    title: "join",
    inputs: ["in"],
    outputs: ["out"],
    x: x0 + 3*dx,
    y: y0 + 2*dy
  },
  {
    title: "subtract",
    inputs: ["subtrahend", "minuend"],
    outputs: ["out"],
    x: x0 + 3*dx,
    y: y0
  },
  {
    title: "normalize",
    inputs: ["numerator", "denominator"],
    outputs: ["out"],
    x: x0 + 4*dx,
    y: y0 + dy
  },
  {
    title: "footprint",
    inputs: ["in"],
    outputs: ["out"],
    x: x0 + 5*dx,
    y: y0 + dy
  },
  
];

const opts = {
    modules: module_opts,
    wires: [
        {source: [0, "out"], target: [3, "in"]},
        {source: [1, "out"], target: [4, "in"]},
        {source: [2, "out"], target: [5, "in"]},
        {source: [3, "out"], target: [6, "in"]},
        {source: [4, "out"], target: [7, "in"]},
        {source: [5, "out"], target: [8, "in"]},
        {source: [8, "out"], target: [9, "in"]},
        {source: [6, "out"], target: [10, "subtrahend"]},
        {source: [7, "out"], target: [10, "minuend"]},
        {source: [10, "out"], target: [11, "numerator"]},
        {source: [9, "out"], target: [11, "denominator"]},
        {source: [11, "out"], target: [12, "in"]}
    ]
}

const e = new dataflowEditor();
e.data([opts]);
select("#editor_div").call(e);


var contextMenuShowing = false;

e.svg().on('contextmenu', function (event, d) {
    if (contextMenuShowing) {
        event.preventDefault();
        select(".popup").remove();
        contextMenuShowing = false;
    } else {
        const d3_target = select(event.target);
        if (d3_target.classed("wire")) {
            event.preventDefault();
            contextMenuShowing = true;

            // Build the popup            
            const popup = select("#editor_div")
            .append("div")
            .attr("class", "popup")
            .style("left", event.x + "px")
            .style("top", event.y + "px")
            .append("ul")
            
            popup.append("li").text("delete").on("click", function() {
                var active_data = d3_target.datum();
                var parentNode = d3_target.node().parentNode;
                var wires = select(parentNode).datum().wires;
                for (var i=0; i<wires.length; i++) {
                    var w = wires[i]; 
                    if (w.src == active_data.src && w.tgt == active_data.tgt) {
                        wires.splice(i,1);
                        break;
                    }
                };
                parentNode.update();
                select(".popup").remove(); 
                contextMenuShowing=false;
                
            });
            console.log(popup);
        }
        else if (d3_target.classed("title")) {
            event.preventDefault();
            contextMenuShowing = true;

            // Build the popup            
            const popup = select("#editor_div")
            .append("div")
            .attr("class", "popup")
            .style("left", event.x + "px")
            .style("top", event.y + "px")
            .append("ul")
            
            popup.append("li").text("configure").on("click", function() {alert("implement configure"); select(".popup").remove(); contextMenuShowing=false;});
            popup.append("hr")
            popup.append("li").text("delete").on("click", function() {
                console.log(d3_target.datum().module_id);
                var module_id = d3_target.datum().module_id;
                e.svg().datum().modules = e.svg().datum().modules.filter(function(d) { return d.module_id != module_id});
                select(".popup").remove(); 
                e.update();
                contextMenuShowing=false;
            });
        }
                     
    }
})

select('#new_module').on("change", function() {
    var title = this.value;
    e.data()[0].modules.push({title: title});
    e.update();
});

select("#show_value").on("click", function() { var win = window.open(); win.document.write("<pre>" + JSON.stringify(e.data()[0], null, 2) + "</pre>")});

</script>
<div id="controls">
    <select id="new_module">
        <option>Load</option>
        <option>Subtract background</option>
        <option>Slice</option>
    </select>
    <button id="show_value">Show data</button>
</div>
<div id="editor_div">
</div>
</body>
</html>
